<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscar | GMA Consultores</title>
<meta name="description" content="Buscá servicios, novedades y oportunidades laborales en el archivo público de GMA Consultores.">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="../wp-content/uploads/2020/07/GMA.-Web.-Favicon.png">
<style>
:root{--red:#b80a13;--dark:#172331;--muted:#58677a;--line:#dce3ea}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;color:var(--dark);background:#f8fafc;line-height:1.5}
a{color:var(--red)}a:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
header{background:#fff;border-bottom:1px solid var(--line)}.wrap{width:min(1080px,calc(100% - 36px));margin:auto}
header .wrap{display:flex;justify-content:space-between;align-items:center;min-height:80px;gap:20px}
.brand{font-size:1.3rem;font-weight:800;color:var(--dark);text-decoration:none}
nav a{font-weight:600;text-decoration:none;margin-left:16px}
main{padding:clamp(38px,6vw,86px) 0}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.12;letter-spacing:-.025em;margin:0 0 18px}
.intro{color:var(--muted);font-size:1.08rem;max-width:62ch}
.search{display:flex;gap:10px;margin:30px 0 24px}input[type=search]{flex:1;min-width:0;padding:15px 18px;border:1px solid #bdcbd8;background:#fff;border-radius:11px;font:inherit}
button{border:0;border-radius:11px;background:var(--red);color:white;font:inherit;font-weight:700;padding:12px 23px;cursor:pointer;min-height:52px}
button:hover{background:#8c0710}
.result-count{color:var(--muted);font-weight:600;margin:0 0 18px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:15px;list-style:none;padding:0;margin:0}
.results li{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:0 6px 18px #1c29380a}
.results li:hover{border-color:#e19fa2}
.results a{text-decoration:none;font-weight:700;font-size:1.06rem;color:var(--dark)}
.results a:hover{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:4px}
.kind{font-size:.73rem;text-transform:uppercase;letter-spacing:.08em;color:var(--red);font-weight:800;margin-bottom:8px}
footer{padding:26px 0;border-top:1px solid var(--line);color:var(--muted)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 25px}
.tools label{display:flex;align-items:center;gap:9px;font-size:.9rem;font-weight:700}
.tools select{border-radius:9px;min-height:43px;border:1px solid #bdcbd8;padding:6px 10px;background:#fff;color:var(--dark);font:inherit}
.results p{font-size:.9rem;color:var(--muted);margin:12px 0 0;line-height:1.55}
.pages{display:flex;justify-content:center;align-items:center;gap:14px;margin:32px 0 0}
.pages button{min-height:42px;padding:9px 17px;font-size:.88rem}
.pages button:disabled{opacity:.45;cursor:not-allowed}
.pages span{color:var(--muted);font-size:.88rem}
@media(max-width:600px){.search{flex-direction:column}button{width:100%}nav a{margin-left:7px}}

/* Compact, fluid search UI for the Cloudflare preview */
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{min-width:280px;overflow-wrap:break-word}
.wrap{width:min(1040px,calc(100% - 36px))}
header .wrap{min-height:64px}
main{padding:clamp(26px,4.5vw,53px) 0}
h1{font-size:clamp(1.9rem,4.5vw,2.85rem);line-height:1.13;letter-spacing:-.035em;margin:0 0 10px;text-wrap:balance}
.intro{font-size:1rem;line-height:1.55;margin:0 0 16px}
.search{gap:10px;margin:16px 0}
input[type=search]{min-height:46px;padding:10px 14px;font-size:16px}
button{min-height:46px;padding:9px 17px}
.tools{gap:10px;margin-bottom:16px}
.tools label{flex-wrap:wrap;gap:8px}
.tools select{min-height:44px;max-width:100%;font-size:14px}
.result-count{margin:0}
.results{gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.results li{padding:17px;min-width:0}
.results p{margin:9px 0 0;line-height:1.5}
.kind{margin-bottom:5px}
.pages{flex-wrap:wrap;gap:10px;margin:19px 0 0}
.pages button{min-height:44px}
footer{padding:17px 0}
a{overflow-wrap:anywhere}
@media(max-width:620px){
 .wrap{width:calc(100% - 32px)}
 header .wrap{min-height:59px}
 header nav{display:flex;flex-wrap:wrap;gap:6px 12px}
 nav a{margin:0;font-size:14px}
 main{padding:26px 0 32px}
 .search{flex-direction:column}
 .search button{width:100%}
 .tools{align-items:flex-start;flex-direction:column}
 .tools label{width:100%;justify-content:space-between}
 .tools select{flex:0 1 auto;min-width:150px}
 .results{grid-template-columns:1fr;gap:10px}
 .results li{padding:15px}
}
@media(max-width:360px){
 .wrap{width:calc(100% - 28px)}
 .tools label{align-items:flex-start;flex-direction:column}
 .tools select{width:100%}
 nav a{font-size:13px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:0s!important}}
</style>
</head>
<body>
<header><div class="wrap"><a href="../index.html" class="brand">GMA <span style="color:#b80a13">Consultores</span></a><nav aria-label="Secciones"><a href="../novedades/">Novedades</a><a href="../contacto/">Contacto</a></nav></div></header>
<main class="wrap">
<h1>Encontrá lo que buscás</h1>
<p class="intro">Explorá las páginas, servicios, novedades y publicaciones conservadas en el archivo de GMA.</p>
<form class="search" action="index.html" method="get" role="search">
<label for="consulta" style="position:absolute;clip:rect(0,0,0,0)">Término de búsqueda</label>
<input id="consulta" type="search" name="s" placeholder="Buscar por palabra, servicio o tema" autocomplete="off" required>
<button type="submit">Buscar</button>
</form>
<div class="tools"><p class="result-count" id="status" role="status" aria-live="polite">Preparando el índice de contenidos…</p>
<label for="categoria">Tipo de contenido
<select id="categoria"><option value="todos">Todos</option><option value="institucional">Servicios e información</option><option value="publicación">Publicaciones</option></select>
</label></div>
<ul class="results" id="results"></ul>
<nav class="pages" id="pages" aria-label="Paginación de resultados" hidden>
<button id="prev" type="button">← Anterior</button><span id="pageLabel"></span><button id="next" type="button">Siguiente →</button>
</nav>
</main>
<footer><div class="wrap">GMA Consultores · <a href="../index.html">Volver al inicio</a></div></footer>
<script>
(() => {
  'use strict';
  const input=document.getElementById('consulta');
  const list=document.getElementById('results');
  const status=document.getElementById('status');
  const select=document.getElementById('categoria');
  const paging=document.getElementById('pages');
  const pageLabel=document.getElementById('pageLabel');
  const prev=document.getElementById('prev'),next=document.getElementById('next');
  const params=new URLSearchParams(location.search);
  const query=(params.get('s')||params.get('q')||'').trim().slice(0,120);
  input.value=query;
  const normalized=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const words=normalized(query).split(/\s+/).filter(Boolean);
  let data=[],filtered=[],page=0;
  const perPage=12;
  function rank(item) {
    if(!words.length) return item.type==='institucional'?100:0;
    const title=normalized(item.title),description=normalized(item.description);
    const body=normalized(item.body),url=normalized(item.url);
    if(!words.every(w=>title.includes(w)||description.includes(w)||body.includes(w)||url.includes(w)))return -1;
    let score=item.type==='institucional'?8:0;
    for(const w of words){
      if(title.includes(w))score+=18;
      if(title.startsWith(w))score+=8;
      if(description.includes(w))score+=5;
      if(body.includes(w))score+=2;
      if(url.includes(w))score+=1;
    }
    return score;
  }
  function render() {
    list.replaceChildren();
    const total=filtered.length;
    const pages=Math.max(1,Math.ceil(total/perPage));
    page=Math.max(0,Math.min(page,pages-1));
    const start=page*perPage;
    status.textContent=total
      ? total+' resultados'+(query?' para «'+query+'»':'')+'.'
      : 'No encontramos resultados. Probá otras palabras o cambiá el filtro.';
    for(const item of filtered.slice(start,start+perPage)){
      const li=document.createElement('li');
      const kind=document.createElement('div');
      kind.className='kind';kind.textContent=item.type;
      const link=document.createElement('a');link.href='..'+item.url;link.textContent=item.title;
      li.append(kind,link);
      if(item.description){
        const p=document.createElement('p');p.textContent=item.description;li.append(p);
      }
      list.append(li);
    }
    paging.hidden=total<=perPage;
    prev.disabled=page===0;next.disabled=page+1>=pages;
    pageLabel.textContent='Página '+(page+1)+' de '+pages;
  }
  function refresh(){
    const type=select.value;
    filtered=data.map(item=>({...item,score:rank(item)}))
      .filter(item=>item.score>=0&&(type==='todos'||item.type===type))
      .sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title,'es'));
    page=0;render();
  }
  prev.addEventListener('click',()=>{if(page>0){page--;render();}});
  next.addEventListener('click',()=>{if((page+1)*perPage<filtered.length){page++;render();}});
  select.addEventListener('change',refresh);
  fetch('../assets/gma-search-index.json',{cache:'force-cache'})
    .then(resp=>{if(!resp.ok)throw Error('No se pudo cargar el índice');return resp.json();})
    .then(json=>{
      if(!Array.isArray(json))throw Error('Índice inválido');
      data=json.filter(item=>item&&typeof item.title==='string'&&typeof item.url==='string'
        &&/^\/[a-z0-9%_\-./]*\/$/i.test(item.url));
      refresh();
    })
    .catch(()=>{status.textContent='No pudimos cargar los contenidos. Intentá nuevamente más tarde.';});
})();
</script>
</body>
</html>
