<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscar | GMA Consultores</title>
<meta name="description" content="Buscá servicios, novedades y oportunidades laborales en el archivo público de GMA Consultores.">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="../wp-content/uploads/2020/07/GMA.-Web.-Favicon.png">
<style>
:root{--red:#b80a13;--dark:#172331;--muted:#58677a;--line:#dce3ea}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0;color:var(--dark);background:#f8fafc;line-height:1.5}
a{color:var(--red)}a:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
header{background:#fff;border-bottom:1px solid var(--line)}.wrap{width:min(1080px,calc(100% - 36px));margin:auto}
header .wrap{display:flex;justify-content:space-between;align-items:center;min-height:80px;gap:20px}
.brand{font-size:1.3rem;font-weight:800;color:var(--dark);text-decoration:none}
nav a{font-weight:600;text-decoration:none;margin-left:16px}
main{padding:clamp(38px,6vw,86px) 0}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.12;letter-spacing:-.025em;margin:0 0 18px}
.intro{color:var(--muted);font-size:1.08rem;max-width:62ch}
.search{display:flex;gap:10px;margin:30px 0 24px}input[type=search]{flex:1;min-width:0;padding:15px 18px;border:1px solid #bdcbd8;background:#fff;border-radius:11px;font:inherit}
button{border:0;border-radius:11px;background:var(--red);color:white;font:inherit;font-weight:700;padding:12px 23px;cursor:pointer;min-height:52px}
button:hover{background:#8c0710}
.result-count{color:var(--muted);font-weight:600;margin:0 0 18px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:15px;list-style:none;padding:0;margin:0}
.results li{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:0 6px 18px #1c29380a}
.results li:hover{border-color:#e19fa2}
.results a{text-decoration:none;font-weight:700;font-size:1.06rem;color:var(--dark)}
.results a:hover{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:4px}
.kind{font-size:.73rem;text-transform:uppercase;letter-spacing:.08em;color:var(--red);font-weight:800;margin-bottom:8px}
footer{padding:26px 0;border-top:1px solid var(--line);color:var(--muted)}
@media(max-width:600px){.search{flex-direction:column}button{width:100%}nav a{margin-left:7px}}
</style>
</head>
<body>
<header><div class="wrap"><a href="../index.html" class="brand">GMA <span style="color:#b80a13">Consultores</span></a><nav aria-label="Secciones"><a href="../novedades/">Novedades</a><a href="../contacto/">Contacto</a></nav></div></header>
<main class="wrap">
<h1>Encontrá lo que buscás</h1>
<p class="intro">Explorá las páginas, servicios, novedades y publicaciones conservadas en el archivo de GMA.</p>
<form class="search" action="index.html" method="get" role="search">
<label for="consulta" style="position:absolute;clip:rect(0,0,0,0)">Término de búsqueda</label>
<input id="consulta" type="search" name="s" placeholder="Buscar por palabra, servicio o tema" autocomplete="off" required>
<button type="submit">Buscar</button>
</form>
<p class="result-count" id="status" role="status" aria-live="polite">Ingresá un término de búsqueda.</p>
<ul class="results" id="results"></ul>
</main>
<footer><div class="wrap">GMA Consultores · <a href="../index.html">Volver al inicio</a></div></footer>
<script>
(async function(){
 const input=document.getElementById('consulta'),list=document.getElementById('results'),status=document.getElementById('status');
 const q=(new URLSearchParams(location.search).get('s')||new URLSearchParams(location.search).get('q')||'').trim();
 input.value=q; if(!q)return;
 const normalized=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const terms=normalized(q).split(/\s+/).filter(Boolean);
 status.textContent='Buscando…';
 try {
  const resp=await fetch('../assets/gma-search-index.json',{cache:'force-cache'});
  if(!resp.ok)throw Error('No se pudo cargar el índice');
  const data=await resp.json();
  const hits=data.filter(item=>terms.every(t=>normalized(item.title+' '+item.url).includes(t)))
    .sort((a,b)=>(b.type==='institucional')-(a.type==='institucional')).slice(0,100);
  status.textContent=hits.length?(hits.length+' resultados mostrados para «'+q+'»'):'No encontramos resultados para «'+q+'». Probá otros términos.';
  for(const item of hits){const li=document.createElement('li'),kind=document.createElement('div'),a=document.createElement('a');
   kind.className='kind';kind.textContent=item.type;a.href='..'+item.url;a.textContent=item.title;
   li.append(kind,a);list.append(li);}
 }catch(err){status.textContent='No pudimos completar la búsqueda. Intentá nuevamente.';}
})();
</script>
</body>
</html>
